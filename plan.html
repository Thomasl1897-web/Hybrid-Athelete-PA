/* ============ sheets ============ */
function openSheet(title, html){
  document.getElementById("sheetTitle").innerHTML = title;
  document.getElementById("sheetBody").innerHTML = html;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  document.getElementById("sheetBody").scrollTop = 0;
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

function recipeSheet(dayN, i){ showRecipe(planDay(dayN).slots[i]); }
function showRecipe(s){
  const r = recipeOf(s), ing = ingredientsOf(s);
  const nt = NOTES[s.ref], m = s.macros;
  const isB = s.kind === "batch";
  const frozen = isB && s.portion != null && isFrozen(s.ref, s.portion);

  let meta = isB
    ? `Batch cook · makes ${r.portions} · ${r.time}` + (s.portion != null ? ` · you're on portion ${s.portion}` : "")
    : `${r.prep}`;
  if (frozen) meta += " · from the freezer";

  openSheet(esc(s.name.replace(/ — portion.*/,"")), `
    <div class="note" style="margin:-4px 0 14px">${esc(meta)}</div>
    <div class="macros" style="margin:0 0 18px">
      <div class="macro"><div class="v">${r0(m.kcal)}</div><div class="k">kcal</div></div>
      <div class="macro"><div class="v">${r0(m.p)}</div><div class="k">protein</div></div>
      <div class="macro"><div class="v">${r0(m.c)}</div><div class="k">carbs</div></div>
      <div class="macro"><div class="v">${r0(m.f)}</div><div class="k">fat</div></div>
    </div>

    <div class="eyebrow" style="margin-bottom:7px">Ingredients${isB?" — per portion":""}</div>
    <div class="card" style="margin-bottom:20px">
      ${Object.keys(ing).map(k=>`<div class="ing"><span>${esc(foodName(k))}</span><span class="q">${ing[k]} g</span></div>`).join("")}
    </div>

    ${nt ? `
      <div class="authored"><span>✎</span><span>Method, storage and swaps below were written for you — they aren't in your plan document. Quantities above are.</span></div>
      <div class="eyebrow" style="margin-bottom:9px">Method</div>
      <ol class="steps">${nt.method.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      <div class="card" style="margin-top:6px">
        <div class="kv"><b>Storage</b>${esc(nt.storage)}</div>
        <div class="kv"><b>Reheating</b>${esc(nt.reheat)}</div>
        <div class="kv"><b>Swaps</b>${esc(nt.subs)}</div>
      </div>`
    : `<div class="note">No method written for this one yet.</div>`}
  `);
}

function daySheet(){
  const iso = todayISO(), cur = dayIndexFor(iso);
  const fits = alignedDays(iso), wd = realWeekday(iso);
  openSheet("Which plan day is today?", `
    <div class="note" style="margin:-4px 0 14px">Pick the day you're actually eating today. Meals, prep and thaw reminders all recalculate.</div>
    ${isAligned(iso) || isReordered() ? "" : `
      <div class="authored" style="color:var(--amber)">
        <span>!</span><span>Your cycle is sitting on the wrong weekday. The plan pins office days to specific weekdays, so lunch-packing reminders are currently landing a few days out. ${fits.length ? "Day " + fits.join(" or ") + " would line up with a real " + esc(wd) + "." : ""}</span>
      </div>`}
    <div class="card card-tight">${MEAL.days.map(d=>{
      const dinner = (d.slots.find(s=>s.slot==="Dinner")||{}).name || "";
      return `<button class="opt" data-setday="${d.day}" aria-selected="${d.day===cur}">
        <span>Day ${d.day} <span style="color:var(--faint)">· ${esc(d.weekday)}${d.location==="OFFICE"?" · office":""}</span>
        ${fits.includes(d.day)?'<span class="pill">lines up with today</span>':""}<br>
        <small style="color:var(--faint);font-size:12px">${esc(dinner.replace(/ — portion.*/,""))}</small></span>
        ${d.day===cur?'<span class="tick">✓</span>':""}
      </button>`;}).join("")}</div>`);
}

function recoverySheet(){
  openSheet("Recovery &amp; mobility", `
    <div class="note" style="margin:-4px 0 16px">${esc(TR.recovery.intro)}</div>
    ${TR.recovery.groups.map(g=>`
      <div class="eyebrow" style="margin:0 0 7px">${esc(g[0])}</div>
      <div class="card" style="margin-bottom:16px">
        ${g[1].map(x=>`<div class="ing"><span>${esc(x[0])}</span><span class="q">${esc(x[1])}</span></div>`).join("")}
      </div>`).join("")}`);
}

function progressionSheet(){
  openSheet("Progression &amp; deload", TR.progression.map(p=>`
    <div class="eyebrow" style="margin:0 0 7px">${esc(p[0])}</div>
    <div class="card" style="margin-bottom:16px"><div class="kv">
      ${p[1].map(x=>`<div style="margin-bottom:9px">${esc(x)}</div>`).join("")}
    </div></div>`).join(""));
}

/* ============ backup ============ */
function doExport(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "plan-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d || typeof d !== "object" || !("anchorDay" in d)) throw new Error("not a plan backup");
        S = Object.assign(S, d); save(); render();
        alert("Backup restored.");
      }catch(e){ alert("That file isn't a plan backup — nothing was changed."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ============ render ============ */
function render(){
  const iso = todayISO(), n = dayIndexFor(iso);
  document.getElementById("hDate").textContent = fmtDate(iso);
  document.getElementById("hDay").innerHTML = `Day <b>${n}</b>/${CYCLE} <span class="adj">adjust</span>`;

  const ks = MEAL.days.map(d=>d.totals.kcal), lo = Math.min(...ks), hi = Math.max(...ks);
  document.getElementById("sky").innerHTML = MEAL.days.map(d=>{
    const h = 40 + 60*(d.totals.kcal-lo)/(hi-lo);
    return `<button class="sky ${d.day===n?"is-today":""}" data-tier="${tierOf(d)}"
      style="height:${h}%" data-mealday="${d.day}" title="Day ${d.day} · ${r0(d.totals.kcal)} kcal"></button>`;
  }).join("");

  document.getElementById("main").innerHTML = V[S.tab]();
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  window.scrollTo(0,0);
}

/* ============ events ============ */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-recipe],[data-ref],[data-prep],[data-mealday],[data-mode],[data-sess],[data-finish],[data-sheet],[data-act],[data-move],[data-resetorder],[data-inc],[data-icsweeks],[data-setday],[data-go],[data-week],[data-buy],[data-have],[data-clearshop],[data-trainview],[data-wo],[data-tick],[data-wonav],[data-woclose],[data-restset],[data-restadd],[data-restskip]");
  if (!t) return;
  const d = t.dataset;

  /* --- workout mode (handled first; it owns the screen) --- */
  if (d.woclose !== undefined){ closeWO(); return; }
  if (d.wo){ openWO(d.wo); return; }
  if (d.tick !== undefined && d.tick !== ""){
    const k = d.tick;
    WO.done[k] = !WO.done[k];
    if (WO.done[k]) startRest(); else stopRest();
    renderWO(); return;
  }
  if (d.wonav){
    const sess = TR.sessions.find(s => s.id === WO.sid);
    WO.ex = Math.max(0, Math.min(sess.exercises.length-1, WO.ex + (+d.wonav)));
    stopRest(); renderWO();
    document.querySelector(".wo-bd").scrollTop = 0; return;
  }
  if (d.restset !== undefined){
    const n = +d.restset;
    if (n) S.restSec = Math.max(15, Math.min(300, (S.restSec||90) + n));
    save(); renderWO(); return;
  }
  if (d.restadd !== undefined){ WO.rest += 30; paintRest(); return; }
  if (d.restskip !== undefined){ stopRest(); return; }

  if (d.tab){ S.tab = d.tab; S.trainPick = null; save(); render(); return; }
  if (d.go){ S.tab = d.go; if (d.trainview) S.trainView = d.trainview; save(); render(); return; }
  if (d.recipe){ const [a,b] = d.recipe.split("|"); recipeSheet(+a, +b); return; }
  if (d.ref){
    const [kind, ref] = d.ref.split("|");
    const r = kind === "batch" ? MEAL.batches[ref] : MEAL.singles[ref];
    showRecipe({kind:kind, ref:ref, name:r.name,
      macros: kind === "batch" ? r.per_portion_macros : r.macros});
    return;
  }

  if (d.prep){
    const k = todayISO()+"|"+d.prep;
    S.prep[k] = !S.prep[k]; save(); render(); return;
  }
  if (d.mealday){ S.mealDay = +d.mealday; S.mealMode = "day"; S.tab = "meals"; save(); render(); return; }
  if (d.mode){ S.mealMode = d.mode; save(); render(); return; }
  if (d.sess){ S.trainPick = +d.sess; render(); return; }
  if (d.trainview){ S.trainView = d.trainview; save(); render(); return; }

  /* --- shopping --- */
  if (d.week){ S.shopWeek = +d.week; save(); render(); return; }
  if (d.buy){
    const [w,k] = d.buy.split("|"), key = cycleIndex(todayISO())+"|"+w+"|"+k;
    S.shop[key] = !S.shop[key]; save(); render(); return;
  }
  if (d.have){ S.have[d.have] = !S.have[d.have]; save(); render(); return; }
  if (d.clearshop){
    const pre = cycleIndex(todayISO())+"|"+d.clearshop+"|";
    Object.keys(S.shop).forEach(k => { if (k.indexOf(pre) === 0) delete S.shop[k]; });
    save(); render(); return;
  }

  if (d.finish){
    const sid = d.finish, idx = TR.sessions.findIndex(x=>x.id===sid);
    const entries = S.draft[sid] || {};
    const any = Object.keys(entries).some(k => entries[k].some(x => x && (x.w || x.r)));
    if (!any && !confirm("Nothing logged for this session. Log it as done anyway?")) return;
    S.sessions.push({date:todayISO(), sessionId:sid, entries:JSON.parse(JSON.stringify(entries))});
    delete S.draft[sid];
    S.queueIndex = (idx + 1) % 4;
    S.trainPick = null;
    save();
    if (d.fromwo){ closeWO(); } else { render(); }
    return;
  }

  if (d.sheet === "day") return daySheet();
  if (d.sheet === "bins") return binsSheet();
  if (d.sheet === "reminders") return remindersSheet();
  if (d.inc){
    S.icsInclude = Object.assign({}, S.icsInclude);
    S.icsInclude[d.inc] = !S.icsInclude[d.inc];
    save(); remindersSheet(); return;
  }
  if (d.icsweeks){ S.icsWeeks = +d.icsweeks; save(); remindersSheet(); return; }
  if (d.sheet === "reorder") return reorderSheet();
  if (d.move){
    const [pos, dir] = d.move.split("|").map(Number);
    const a = pos-1, b = pos-1+dir;
    if (b >= 0 && b < CYCLE){
      const o = S.order.slice();
      const tmp = o[a]; o[a] = o[b]; o[b] = tmp;
      S.order = o; save(); reorderSheet();
    }
    return;
  }
  if (d.resetorder !== undefined){
    S.order = MEAL.days.map(x => x.day); save(); reorderSheet(); return;
  }
  if (d.sheet === "recovery") return recoverySheet();
  if (d.sheet === "progression") return progressionSheet();

  if (d.setday){
    S.anchorDate = todayISO(); S.anchorPos = posOfDay(+d.setday); S.anchorDay = +d.setday;
    save(); closeSheet(); render(); return;
  }

  if (d.act === "ics") return exportICS();
  if (d.act === "notify"){
    if (S.notifyInApp){ S.notifyInApp = false; save(); remindersSheet(); }
    else enableNotify().then(()=>remindersSheet());
    return;
  }
  if (d.act === "export") return doExport();
  if (d.act === "import") return doImport();
  if (d.act === "reset"){
    if (confirm("Erase all logged sessions, ticked prep, shopping ticks and settings on this device? This can't be undone.")){
      localStorage.removeItem(KEY);
      location.reload();
    }
    return;
  }
});

document.addEventListener("input", ev => {
  const tm = ev.target.closest("[data-time]");
  if (tm){
    const k = tm.dataset.time, v = tm.value;
    if (!/^\d{2}:\d{2}$/.test(v)) return;
    if (k === "__prep") S.prepTime = v;
    else if (k === "__bin") S.binTime = v;
    else { S.times = Object.assign({}, S.times); S.times[k] = v; }
    save();
    const btn = document.querySelector('[data-act="ics"]');
    if (btn) btn.textContent = "Download " + countICS() + " reminders";
    return;
  }
  const el = ev.target.closest("[data-in]");
  if (!el) return;
  const [sid, i, k, f] = el.dataset.in.split("|");
  S.draft[sid] = S.draft[sid] || {};
  S.draft[sid][i] = S.draft[sid][i] || [];
  S.draft[sid][i][k] = S.draft[sid][i][k] || {};
  const v = el.value.trim();
  if (v === "") delete S.draft[sid][i][k][f];
  else S.draft[sid][i][k][f] = v;
  save();
});

document.getElementById("scrim").addEventListener("click", closeSheet);
document.getElementById("sheetX").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.getElementById("hDay").addEventListener("click", daySheet);

/* midnight rollover */
let lastSeen = todayISO();
setInterval(() => {
  if (todayISO() !== lastSeen){ lastSeen = todayISO(); render(); }
  tickNotify();
}, 60000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && todayISO() !== lastSeen){ lastSeen = todayISO(); render(); }
});

load(); render();
</script>
